# Leak scan of the full git history: gitleaks default secret rules plus this repo's .gitleaks.toml
# (tailnet hostnames, Tailscale ACL tags, personal email, local model name). A hit fails the job.
#
# Runs the pinned gitleaks release binary directly. gitleaks/gitleaks-action is not used: it needs a
# GITLEAKS_LICENSE key for repos owned by an organization.
name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/${sums}"
          grep "  ${tarball}\$" "${sums}" | sha256sum -c -
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks version

      - name: Scan history
        run: '"${RUNNER_TEMP}/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .'
